  <script>
    (function(){try{var t=localStorage.getItem('transformx-theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',(t==='dark'||t==='light')?t:(d?'dark':'light'));}catch(e){document.documentElement.setAttribute('data-theme','light');}}());
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Superficies de identidad AUTH-01 a AUTH-12 del prototipo. Sin credenciales, IdP ni MFA reales.">

<body data-route="auth" class="ws-body">
  <div data-workspace-shell></div>
  <div class="auth-layout">
    <main id="main-content" tabindex="-1">
      <section class="auth-card" aria-labelledby="auth-title">
        <p class="auth-card__code" data-auth-code>AUTH-01</p>
        <h1 class="auth-card__title" id="auth-title" data-auth-title>Iniciar sesión</h1>
        <p class="auth-card__intro" data-auth-intro></p>
        <div class="auth-feedback ws-feedback" data-auth-feedback role="status" aria-live="polite" tabindex="-1"></div>
        <div data-auth-surface></div>
        <div class="ws-actions" data-auth-actions hidden></div>
      </section>
    </main>
    <nav class="auth-index" aria-label="Superficies de identidad">
      <h2 class="auth-index__title">AUTH-01 … AUTH-12</h2>
      <ul data-auth-index></ul>
    </nav>
  </div>
